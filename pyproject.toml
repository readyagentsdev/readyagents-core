[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readyagentsdev"
version = "0.8.2"
description = "Local one-shot YAML/JSON agent workflow engine + MCP toolkit (BYOK)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "ReadyAgents contributors" }]
keywords = ["agents", "workflow", "mcp", "llm", "byok", "yaml", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
mcp = ["mcp>=1.2,<3"]
all = ["openai>=1.40", "anthropic>=0.34", "mcp>=1.2,<3"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "build>=1.2",
    "openai>=1.40",
    "anthropic>=0.34",
    "mcp>=1.2,<3",
]

[project.scripts]
readyagents = "readyagents.cli:app"

[project.urls]
Homepage = "https://readyagents.dev"
Source = "https://github.com/readyagentsdev/readyagents-core"
Issues = "https://github.com/readyagentsdev/readyagents-core"
Documentation = "https://github.com/readyagentsdev/readyagents-core/tree/main/docs"

[project.entry-points."readyagents.packs"]

[tool.hatch.build.targets.wheel]
packages = ["src/readyagents"]

[tool.hatch.build.targets.wheel.force-include]
"src/readyagents/approvals/assets/index.html" = "readyagents/approvals/assets/index.html"
"src/readyagents/approvals/assets/app.js" = "readyagents/approvals/assets/app.js"
"src/readyagents/approvals/assets/style.css" = "readyagents/approvals/assets/style.css"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/LICENSE",
    "/README.md",
    "/Dockerfile",
    "/docker-compose.yml",
    "/Makefile",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/readyagents/cli.py" = ["B008"]
"tests/**" = ["B018", "E501"]
