[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readyagentsdev"
version = "2.0.7"
description = "Local one-shot YAML/JSON agent workflow engine + MCP toolkit (BYOK)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "ReadyAgents contributors" }]
keywords = ["agents", "workflow", "mcp", "llm", "byok", "yaml", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
gemini = ["google-genai>=1.0"]
bedrock = ["boto3>=1.34"]
vertex = ["google-cloud-aiplatform>=1.70"]
mcp = ["mcp>=1.2,<3"]
mcp2 = ["mcp>=2,<3"]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
tokenizer = ["tiktoken>=0.7"]
jwt = ["PyJWT>=2.8", "cryptography>=42"]
sign = ["cryptography>=42"]
image = ["pillow>=10.0"]
pdf = ["pypdf>=4.0"]
audio = ["pydub>=0.25"]
table = ["pandas>=2.0", "pyarrow>=14"]
all = ["openai>=1.40", "anthropic>=0.34", "mcp>=1.2,<3"]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "mypy==2.3.1",
    "mypy-baseline==0.7.4",
    "build>=1.2",
    "openai>=1.40",
    "anthropic>=0.34",
    "mcp>=1.2,<3",
    "jsonschema>=4.18",
    "PyJWT>=2.8",
    "cryptography>=42",
    "pandas>=2.0",
    "pyarrow>=14",
]

[project.scripts]
readyagents = "readyagents.cli:app"

[project.urls]
Homepage = "https://readyagents.dev"
Source = "https://github.com/readyagentsdev/readyagents-core"
Issues = "https://github.com/readyagentsdev/readyagents-core"
Documentation = "https://github.com/readyagentsdev/readyagents-core/tree/main/docs"

[project.entry-points."readyagents.packs"]

[tool.hatch.build.targets.wheel]
packages = ["src/readyagents"]

[tool.hatch.build.targets.wheel.force-include]
"src/readyagents/approvals/assets/index.html" = "readyagents/approvals/assets/index.html"
