# PyPI Trusted Publisher (OIDC) — no API token in GitHub secrets.
# Before first success, on https://pypi.org as user readyagentsdev register:
#   Project: readyagentsdev (or pending publisher if project not created yet)
#   Owner: readyagentsdev
#   Repository: readyagentsdev/readyagents-core
#   Workflow: publish.yml
#   Environment: (leave blank unless you add a GitHub Environment named below)
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    steps:
      - name: Require green CI on the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          # Exclude this workflow's jobs and MCP Registry publish (tag-push race
          # before PyPI exists) so only CI check runs gate the release.
          FILTER='select(.name != "build-and-publish" and .name != "ci-gate" and .name != "publish")'
          # A release can fire while CI is still running: wait for checks to
          # finish instead of treating a still-running check as not-green.
          for i in $(seq 1 40); do
            DATA=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?per_page=100")
            TOTAL=$(echo "$DATA" | jq "[.check_runs[] | $FILTER] | length")
            PENDING=$(echo "$DATA" | jq "[.check_runs[] | $FILTER | select(.status != \"completed\")] | length")
            GREEN=$(echo "$DATA" | jq "[.check_runs[] | $FILTER | select(.status == \"completed\" and .conclusion == \"success\")] | length")
            echo "CI check runs on $SHA: $GREEN/$TOTAL green, $PENDING pending (publish jobs excluded)"
            if [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ]; then break; fi
            echo "waiting for CI to settle ($i/40)..."
            sleep 60
          done
          if [ "$TOTAL" -eq 0 ]; then echo "refusing to publish: no CI check runs on $SHA"; exit 1; fi
          if [ "$PENDING" -ne 0 ]; then echo "refusing to publish: $PENDING check(s) still not completed on $SHA"; exit 1; fi
          if [ "$GREEN" -ne "$TOTAL" ]; then echo "refusing to publish: CI is not green on $SHA"; exit 1; fi

  build-and-publish:
    needs: [ci-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: |
          python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
