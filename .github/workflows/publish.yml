# PyPI Trusted Publisher (OIDC) — no API token in GitHub secrets.
# Before first success, on https://pypi.org as user readyagentsdev register:
#   Project: readyagentsdev (or pending publisher if project not created yet)
#   Owner: readyagentsdev
#   Repository: readyagentsdev/readyagents-core
#   Workflow: publish.yml
#   Environment: (leave blank unless you add a GitHub Environment named below)
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: |
          python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
