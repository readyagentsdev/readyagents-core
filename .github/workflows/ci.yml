name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Schema drift
        run: readyagents schema --check schemas/workflow-v1.json

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          # 2026-09-09: bound non-Linux wall-clock to oldest+newest Python; Linux keeps 3.11–3.14.
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest
        timeout-minutes: 10
        run: python -m pytest
      - name: Keyless smoke
        run: python scripts/smoke.py

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Batch harness
        run: python scripts/bench_batch.py --rows 20 --concurrency 4 --json
      - name: Baseline method is recorded
        run: |
          python -c "import json; json.load(open('baselines/bench_batch.json')); print('ok')"
      - name: Offline benchmark suite
        run: readyagents bench run --offline --out results.json --json
      - name: Offline bench vs baseline
        run: readyagents bench compare results.json --baseline baselines/bench_offline.json --json

  extras:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [openai, anthropic, mcp, all]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install extra
        run: |
          python -m pip install --upgrade pip
          pip install ".[${{ matrix.extra }}]"
      - name: Import extra
        run: python -c "import readyagents; print(readyagents.__version__)"

  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  wheel-install:
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
      - name: Pip-only first run
        shell: bash
        run: |
          readyagents doctor --json
          readyagents new smoke-flow --dest smoke-flow
          readyagents validate smoke-flow/workflow.yaml
          readyagents run smoke-flow/workflow.yaml --dry-run --no-persist
          readyagents run smoke-flow/workflow.yaml
          readyagents runs list
          readyagents new --list-examples
          readyagents new f --from-example calc_pipeline
          readyagents run f/workflow.yaml

  airgap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Keyless examples under sovereign
        env:
          READYAGENTS_SOVEREIGN: "1"
        run: |
          # Network-namespace only the smoke child. iptables OUTPUT DROP
          # also severs the runner agent from GitHub and the job hangs.
          PY="$(python -c 'import sys; print(sys.executable)')"
          sudo unshare -n --fork --kill-child -- \
            env HOME="$HOME" \
                PATH="$(dirname "$PY"):$PATH" \
                READYAGENTS_SOVEREIGN=1 \
                RES_OPTIONS="attempts:1 timeout:1" \
                PYTHONUNBUFFERED=1 \
            bash -c 'ip link set lo up && cd "$1" && exec "$2" scripts/smoke.py' \
            bash "$GITHUB_WORKSPACE" "$PY"

  docs-commands:
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Blocks are POSIX shell (cp, make); Windows install coverage stays in wheel-install.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
      - name: Run README and getting-started blocks
        shell: bash
        run: python scripts/check_doc_commands.py --python "$(which python)"

  ten-minute:
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
      - name: README ten-minute path
        shell: bash
        run: |
          set -euo pipefail
          unset READYAGENTS_HOME
          mkdir ten-minute && cd ten-minute
          readyagents new my-flow
          readyagents run my-flow/workflow.yaml
          readyagents runs list
          readyagents new g --from-example approval_gate
          set +e
          readyagents run g/workflow.yaml --json > pause.json
          code=$?
          set -e
          test "$code" -eq 2
          ID=$(python -c "import json; print(json.load(open('pause.json'))['run_id'])")
          test -n "$ID"
          readyagents resume "$ID" --approve gate
          test "$(readyagents runs show "$ID" --json | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')" = "succeeded"
          readyagents doctor
          python - "$ID" <<'EOF'
          import json, os, subprocess, sys
          run_id = sys.argv[1]
          doctor = json.loads(subprocess.run(
              ["readyagents", "doctor", "--json"],
              capture_output=True, text=True, check=True).stdout)
          runs_dir = os.path.realpath(doctor["home"]["runs_dir"])
          expected = os.path.realpath(os.path.join(os.getcwd(), ".readyagents", "runs"))
          assert doctor["home"]["source"] == "default", doctor["home"]
          assert runs_dir == expected, (runs_dir, expected)
          record = os.path.join(expected, run_id + ".json")
          assert os.path.isfile(record), record
          print("run store project-local:", expected)
          EOF
