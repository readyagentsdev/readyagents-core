name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Schema drift
        run: readyagents schema --check schemas/workflow-v1.json

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          # 2026-09-09: bound non-Linux wall-clock to oldest+newest Python; Linux keeps 3.11–3.14.
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest
      - name: Keyless smoke
        run: python scripts/smoke.py

  extras:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [openai, anthropic, mcp, all]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install extra
        run: |
          python -m pip install --upgrade pip
          pip install ".[${{ matrix.extra }}]"
      - name: Import extra
        run: python -c "import readyagents; print(readyagents.__version__)"

  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  wheel-install:
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
      - name: Pip-only first run
        shell: bash
        run: |
          readyagents doctor --json
          readyagents new smoke-flow --dest smoke-flow
          readyagents validate smoke-flow/workflow.yaml
          readyagents run smoke-flow/workflow.yaml --dry-run --no-persist

  airgap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Block non-loopback egress
        run: |
          sudo iptables -P OUTPUT DROP
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -p udp --dport 53 -j REJECT || true
          sudo iptables -A OUTPUT -p tcp --dport 53 -j REJECT || true
      - name: Keyless examples under sovereign
        env:
          READYAGENTS_SOVEREIGN: "1"
        run: python scripts/smoke.py
