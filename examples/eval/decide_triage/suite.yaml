# Keyless mechanism suite. A passing run does not calibrate a threshold.
# Route cases omit min_confidence and expect the shim heuristic.
# Gate cases set min_confidence (via the shipped example) and expect the human gate.
cases:
  - name: route-refund
    workflow: route.yaml
    inputs:
      message: "Please refund the duplicate payment on my subscription"
    expect_status: succeeded
    expect_nodes: [triage, billing_queue, done]
    expect_contains:
      result: "Billing queue"

  - name: route-invoice
    workflow: route.yaml
    inputs:
      message: "Invoice shows I was charged twice for the subscription"
    expect_status: succeeded
    expect_nodes: [triage, billing_queue, done]
    expect_contains:
      result: "Billing queue"

  - name: route-renewal
    workflow: route.yaml
    inputs:
      message: "My subscription renewal payment failed"
    expect_status: succeeded
    expect_nodes: [triage, billing_queue, done]
    expect_contains:
      result: "Billing queue"

  - name: route-bugs
    workflow: route.yaml
    inputs:
      message: "The integration has bugs and technical problems after deploy"
    expect_status: succeeded
    expect_nodes: [triage, page_oncall, done]
    expect_contains:
      result: "PAGE oncall"

  - name: route-checkout-bug
