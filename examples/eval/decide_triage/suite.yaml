  - name: gate-checkout-outage
    workflow: ../../decide_triage.yaml
    inputs:
      message: >
        Hi, our production checkout has been returning 500s for 20 minutes.
        Customers cannot pay. Please escalate.
    decisions:
      human_review: approve
    expect_status: succeeded
    expect_nodes: [triage, human_review, manual_route, done]
    expect_contains:
