name: contract_reshape
description: Keyless transform with an opt-in output contract. Enforces declared rules only.
inputs:
  ticket_id: T-1
nodes:
  - id: reshape
    type: transform
    parse_json: true
    template: '{"summary": "Ticket {{ ticket_id }} is closed", "ticket_id": "{{ ticket_id }}"}'
    output_key: summary
    contract:
      schema:
        type: object
        required: [summary, ticket_id]
        properties:
          summary: {type: string}
          ticket_id: {type: string}
      rules:
        - require_citation: {from: ticket_id}
        - max_chars: {field: summary, value: 1200}
      on_invalid: fail
