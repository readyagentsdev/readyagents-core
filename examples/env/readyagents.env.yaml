# Example environment bundle. Copy to the workspace root as readyagents.env.yaml.
# Scopes only — secret values are refused. Not a hosted deploy.
version: 1
environments:
  dev:
    budget: {max_cost_usd: 1.00}
    secrets: dev
  staging:
    budget: {max_cost_usd: 5.00}
    secrets: staging
  prod:
    budget: {max_cost_usd: 50.00}
    secrets: prod
    gates:
      approval: {roles: [release_manager]}
    rollback:
      "on": {error_rate_above: 0.05, window: 50}
